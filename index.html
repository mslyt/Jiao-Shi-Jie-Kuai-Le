<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎉 教师节快乐 - 导航页 🎉</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            overflow-x: hidden;
            position: relative;
        }

        /* 飘落的纸张动画背景 */
        .paper-fall {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .paper {
            position: absolute;
            width: 15px;
            height: 15px;
            background: rgba(255, 255, 255, 0.15);
            animation: fall linear infinite;
            clip-path: polygon(0% 0%, 100% 10%, 90% 100%, 10% 90%);
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* 头部样式 */
        .header {
            text-align: center;
            padding: 50px 20px 30px;
            position: relative;
            z-index: 1;
        }

        .header h1 {
            font-size: 3.5em;
            color: #fff;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            animation: titleGlow 2s ease-in-out infinite alternate;
            letter-spacing: 8px;
        }

        .header .subtitle {
            font-size: 1.3em;
            color: rgba(255, 255, 255, 0.85);
            margin-top: 15px;
            letter-spacing: 3px;
        }

        @keyframes titleGlow {
            from {
                text-shadow: 0 4px 15px rgba(0, 0, 0, 0.3), 0 0 20px rgba(255, 200, 100, 0.2);
            }
            to {
                text-shadow: 0 4px 15px rgba(0, 0, 0, 0.3), 0 0 40px rgba(255, 200, 100, 0.6);
            }
        }

        /* 音乐控制 */
        .music-control {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 50px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .music-control:hover {
            background: rgba(255, 255, 255, 0.35);
            transform: scale(1.05);
        }

        .music-control .music-icon {
            font-size: 1.5em;
            animation: musicNote 1s ease-in-out infinite alternate;
        }

        .music-control.playing .music-icon {
            animation: musicSpin 2s linear infinite;
        }

        @keyframes musicSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes musicNote {
            from { transform: scale(1); }
            to { transform: scale(1.2); }
        }

        .music-control span {
            color: #fff;
            font-size: 0.9em;
        }

        /* 主容器 */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        /* 分区标题 */
        .section-title {
            text-align: center;
            margin: 40px 0 25px;
            position: relative;
        }

        .section-title h2 {
            display: inline-block;
            font-size: 1.8em;
            color: #fff;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
            padding: 10px 40px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            letter-spacing: 5px;
        }

        .section-title .emoji {
            font-size: 1.5em;
            vertical-align: middle;
            margin: 0 8px;
        }

        /* 按钮网格 - 四等分（桌面 2×2，宽屏 4 列） */
        .button-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
            padding: 10px;
        }

        /* 贺卡占一格（与另外三个共同四等分） */

        /* 响应式：小屏幕堆叠 */
        @media (max-width: 900px) {
            .button-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .button-grid {
                grid-template-columns: 1fr;
            }
        }

        /* 导航按钮 */
        .nav-btn {
            display: block;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            group: hover;
        }

        .nav-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.15),
                transparent
            );
            transition: left 0.6s;
        }

        .nav-btn:hover::before {
            left: 100%;
        }

        .nav-btn:hover {
            transform: translateY(-8px) scale(1.03);
            background: rgba(255, 255, 255, 0.22);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        .nav-btn .btn-icon {
            font-size: 3em;
            display: block;
            margin-bottom: 12px;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.2));
        }

        .nav-btn .btn-title {
            font-size: 1.3em;
            font-weight: bold;
            color: #fff;
            margin-bottom: 6px;
            letter-spacing: 2px;
        }

        .nav-btn .btn-desc {
            font-size: 0.85em;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.5;
        }

        /* 贺卡按钮特殊样式 */
        .nav-btn.card-btn {
            background: linear-gradient(135deg, rgba(255, 182, 193, 0.25), rgba(255, 105, 130, 0.2));
            border-color: rgba(255, 182, 193, 0.5);
        }

        .nav-btn.card-btn:hover {
            background: linear-gradient(135deg, rgba(255, 182, 193, 0.4), rgba(255, 105, 130, 0.35));
        }

        /* 游戏按钮样式 */
        .nav-btn.game-btn {
            background: rgba(255, 255, 255, 0.1);
        }

        .nav-btn.game-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* 占位按钮（灰色虚线） */
        .nav-btn.placeholder {
            opacity: 0.6;
            border-style: dashed;
        }

        .nav-btn.placeholder .btn-icon {
            opacity: 0.5;
        }

        /* 底部 */
        .footer {
            text-align: center;
            padding: 50px 20px 40px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9em;
            position: relative;
            z-index: 1;
        }

        .footer .heart {
            color: #ff6b6b;
            animation: heartbeat 1.5s ease-in-out infinite;
            display: inline-block;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        /* 弹窗提示 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: modalIn 0.3s ease-out;
            max-width: 400px;
        }

        @keyframes modalIn {
            from { transform: scale(0.7); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal h3 {
            color: #fff;
            font-size: 1.5em;
            margin-bottom: 15px;
        }

        .modal p {
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .modal button {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: #fff;
            padding: 10px 30px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
        }

        .modal button:hover {
            background: rgba(255, 255, 255, 0.35);
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2em;
                letter-spacing: 4px;
            }
            .button-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            .music-control {
                top: 10px;
                right: 10px;
                padding: 8px 15px;
            }
            .music-control span {
                display: none;
            }
        }
    </style>
</head>
<body>

    <!-- 飘落纸张背景 -->
    <div class="paper-fall" id="paperFall"></div>

    <!-- 音乐控制 -->
    <div class="music-control playing" id="musicControl" onclick="toggleMusic()">
        <span class="music-icon">🎵</span>
        <span id="musicText">BGM 播放中</span>
    </div>

    <!-- 背景音乐 -->
    <audio id="bgm" loop autoplay>
        <!-- 使用免费可用的背景音乐URL（可在后续替换为你自己的文件） -->
        <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=relaxing-mountains-rivers-123110.mp3" type="audio/mpeg">
        <!-- 备用音乐源 -->
        <source src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3" type="audio/mpeg">
    </audio>

    <!-- 头部 -->
    <div class="header">
        <h1>🎓 教师节快乐 🎓</h1>
        <p class="subtitle">Happy Teachers' Day · 感谢您的辛勤付出</p>
    </div>

    <div class="container">

        <!-- ==================== 四板块：四等分网格 ==================== -->
      

        <div class="button-grid">
            <!-- 第一个板块：教师节贺卡 -->
            <a href="card_main.html" class="nav-btn card-btn" onclick="checkLink(event, '教师节贺卡')">
                <span class="btn-icon">🌹</span>
                <div class="btn-title">教师节贺卡</div>
            
            </a>

            <!-- 第二个板块：节日刮刮乐 -->
            <a href="game_scratch.html" class="nav-btn game-btn" onclick="checkLink(event, '节日刮刮乐')">
                <span class="btn-icon">🎫</span>
                <div class="btn-title">节日刮刮乐</div>
           
            </a>

            <!-- 第三个板块：合成大蛋糕 -->
            <a href="game_merge.html" class="nav-btn game-btn" onclick="checkLink(event, '合成大蛋糕')">
                <span class="btn-icon">🎂</span>
                <div class="btn-title">合成大蛋糕</div>
             
            </a>

            <!-- 第四个板块：传教师节合影 -->
            <a href="game_photo.html" class="nav-btn game-btn" onclick="checkLink(event, '传教师节合影')">
                <span class="btn-icon">📸</span>
                <div class="btn-title">传教师节合影</div>
                
            </a>
        </div>

    </div>

    <!-- 底部 -->
    <div class="footer">
        <p>
            <span class="heart">❤️</span><br>
            Happy Teachers' Day!<br><br>
            <small>© 2026 教师节快乐 · 导航页面 · 链接占位待补充</small>
        </p>
    </div>

    <!-- 弹窗 -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModal()">
        <div class="modal" onclick="event.stopPropagation()">
            <h3 id="modalTitle">🚧 页面建设中</h3>
            <p id="modalText">该页面链接已预留，后续可补充对应内容。</p>
            <button onclick="closeModal()">知道了</button>
        </div>
    </div>

    <script>
        // ==================== 飘落纸张动画 ====================
        function createPapers() {
            const container = document.getElementById('paperFall');
            const paperCount = 20;

            for (let i = 0; i < paperCount; i++) {
                const paper = document.createElement('div');
                paper.className = 'paper';
                paper.style.left = Math.random() * 100 + '%';
                paper.style.animationDuration = (Math.random() * 5 + 5) + 's';
                paper.style.animationDelay = (Math.random() * 10) + 's';
                paper.style.width = (Math.random() * 10 + 10) + 'px';
                paper.style.height = paper.style.width;
                container.appendChild(paper);
            }
        }
        createPapers();

        // ==================== BGM 控制 ====================
        const bgm = document.getElementById('bgm');
        const musicControl = document.getElementById('musicControl');
        const musicText = document.getElementById('musicText');
        let isPlaying = true;

        // 尝试自动播放（浏览器可能阻止）
        window.addEventListener('load', () => {
            bgm.volume = 0.3;
            const playPromise = bgm.play();
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    isPlaying = true;
                    updateMusicUI();
                }).catch(() => {
                    // 自动播放被阻止，等待用户交互
                    isPlaying = false;
                    updateMusicUI();
                });
            }
        });

        function toggleMusic() {
            if (isPlaying) {
                bgm.pause();
                isPlaying = false;
            } else {
                bgm.play();
                isPlaying = true;
            }
            updateMusicUI();
        }

        function updateMusicUI() {
            if (isPlaying) {
                musicControl.classList.add('playing');
                musicText.textContent = 'BGM 播放中';
            } else {
                musicControl.classList.remove('playing');
                musicText.textContent = 'BGM 已暂停';
            }
        }

        // ==================== 链接检查弹窗 ====================
        function checkLink(event, name) {
            const href = event.currentTarget.getAttribute('href');
            // 如果是占位链接（还未创建），显示提示
            if (href && href.startsWith('card_') || href && href.startsWith('game_') || href && href.startsWith('page_')) {
                // 允许跳转，但实际文件可能不存在
                // 不做阻止，让用户自己补充
            }
        }

        function showModal(title, text) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalText').textContent = text;
            document.getElementById('modalOverlay').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        // ==================== 键盘快捷键 ====================
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                toggleMusic();
            }
            if (e.code === 'Escape') {
                closeModal();
            }
        });
    </script>

</body>
</html>
